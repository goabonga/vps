# Runs the site playbook for an environment once its deploy PR (opened by
# ansible-plan.yml) is merged into `ansible/<env>`. Protect that branch
# (required approving review) so only an authorized person can trigger this
# - see README.md.
#
# On a successful apply, bumps the `ansible-<env>` multicz component: if
# commits touching `inventories/<env>/` itself already justify a bump, that
# drives the version/kind; otherwise the deploy is still real and is
# recorded as a forced patch bump. Either way the `upstream-notes` plugin
# (see multicz.toml) pulls in what the `collection` commits this deploy
# actually shipped.
#
# The ansible branch is realigned on `main` before the apply (whatever the
# merge method, so nothing GitHub recreated, unsigned or duplicated, is
# kept): the only new commit is the signed release commit, fast-forwarded
# onto `main`, then `ansible/<env>` is moved to it with an explicit lease, and
# the deployment gets its GitHub release (`ansible-<env>-v<version>`).
#
# Everything is pushed with the GH_PAT personal access token, never with
# github-actions[bot].

name: ansible-apply

on:
  push:
    branches: ["ansible/*"]

concurrency:
  group: ansible-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-env:
    name: resolve-env
    # The bump below is pushed with the GH_PAT token, which (unlike
    # GITHUB_TOKEN) triggers workflows: skip our own deploy release commit,
    # or every apply would re-trigger itself. Only that one: a deploy pull
    # request may legitimately end with a collection release commit.
    # `apply` depends on this job.
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release): bump ansible-')
    runs-on: ubuntu-24.04
    outputs:
      env: ${{ steps.name.outputs.env }}
    steps:
      - id: name
        run: |
          echo "env=${GITHUB_REF_NAME#ansible/}" >> "$GITHUB_OUTPUT"
          {
            echo "## resolve-env"
            echo
            echo "Branch \`${GITHUB_REF_NAME}\` deploys environment \`${GITHUB_REF_NAME#ansible/}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply (${{ needs.resolve-env.outputs.env }})
    needs: [resolve-env]
    runs-on: ubuntu-24.04
    # Protect this environment (Settings -> Environments -> required
    # reviewers, on a plan that supports it) for a second gate on top of
    # ansible/<env> branch protection.
    environment: ansible-${{ needs.resolve-env.outputs.env }}-apply
    steps:
      - name: Require GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::the GH_PAT secret (personal access token) is required"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true
      # NOTE: no python-version pin here - multicz needs Python >=3.12 and
      # `uv tool install multicz` fails under 3.11.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --no-dev
      - name: Configure ssh
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY_CONTENT: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # The host key comes from a secret, never from a scan of the
          # network: an unexpected host makes the run fail.
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::the VPS_KNOWN_HOSTS secret (known_hosts line of the VPS) is required"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_CONTENT" > ~/.ssh/ovh_vps
          chmod 600 ~/.ssh/ovh_vps
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author from the PAT owner
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          user=$(gh api user)
          login=$(echo "$user" | jq -r .login)
          git config user.name  "$(echo "$user" | jq -r '.name // .login')"
          git config user.email "$(echo "$user" | jq -r .id)+${login}@users.noreply.github.com"
      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
          # GitHub only marks a signature "Verified" when the committer
          # e-mail is one of the key's identities: use the key's first uid
          # instead of the PAT owner's noreply address.
          UID_LINE=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid/{print $10; exit}')
          git config user.name  "${UID_LINE% <*}"
          git config user.email "$(echo "$UID_LINE" | sed -E 's/.*<(.*)>/\1/')"

      - name: Align the ansible branch on main
        id: align
        run: |
          set -euo pipefail
          # Merging the deploy pull request is only the go signal. GitHub
          # recreates the commits of a rebase or squash merge (unsigned, and
          # as duplicates of the ones on main), so the branch is realigned on
          # main: the playbook runs on what main holds, the only new commit
          # is the signed release commit, and nothing GitHub recreated
          # survives. Nothing is pushed before the apply succeeded.
          git fetch origin main
          echo "previous=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git switch -C "$GITHUB_REF_NAME" origin/main

      - name: Install the pinned collection
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: scripts/install-collection.sh "$ENV"

      - name: Compute the version of this deployment
        id: version
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          echo "value=$(scripts/next-ansible-version.sh "$ENV")" >> "$GITHUB_OUTPUT"

      - name: Ansible apply
        shell: bash
        env:
          ENV: ${{ needs.resolve-env.outputs.env }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOYMENT_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [ ! -d "inventories/${ENV}" ]; then
            echo "::error::inventories/${ENV} does not exist"
            exit 1
          fi
          uv run --no-sync ansible-playbook -i "inventories/${ENV}" goabonga.vps.site \
            -e "deployment_version=${DEPLOYMENT_VERSION}" 2>&1 | tee apply.txt

      - name: Bump ansible-<env> and sync ansible branch
        env:
          COMPONENT: ansible-${{ needs.resolve-env.outputs.env }}
          GPG_AVAILABLE: ${{ steps.gpg.outputs.available }}
          DEPLOYMENT_VERSION: ${{ steps.version.outputs.value }}
          PREVIOUS: ${{ steps.align.outputs.previous }}
        run: |
          set -euo pipefail
          SIGN_FLAG=""
          if [ "$GPG_AVAILABLE" = "true" ]; then SIGN_FLAG="--sign"; fi

          PLAN=$(uv tool run multicz plan --output json)
          # `plan --output json` may print a second JSON document (plugin
          # advice) without `bumps`: only read the document that has them.
          PENDING=$(echo "$PLAN" | jq -r --arg c "$COMPONENT" 'select(.bumps != null) | .bumps[$c].kind // empty')
          if [ -n "$PENDING" ]; then
            uv tool run multicz bump --component "$COMPONENT" --commit --tag $SIGN_FLAG --output json | tee bump-result.json
          else
            # No commit on inventories/<env>/ itself justified a bump (the
            # apply may have been driven by a collection change instead) -
            # the deploy still happened, so record it.
            uv tool run multicz bump --force "${COMPONENT}:patch" --commit --tag $SIGN_FLAG --output json | tee bump-result.json
          fi

          # The version passed to the playbook is the one now recorded.
          RECORDED=$(uv tool run multicz get "$COMPONENT")
          if [ "$RECORDED" != "$DEPLOYMENT_VERSION" ]; then
            echo "::error::deployed ${DEPLOYMENT_VERSION} but multicz recorded ${RECORDED}"
            exit 1
          fi

          # Publish: the release commit lands on main as a fast-forward (main
          # is rejected if it moved on meanwhile, before anything else is
          # touched), then the ansible branch is realigned on it, then the tag.
          git push origin "HEAD:main"
          git push --force-with-lease="${GITHUB_REF_NAME}:${PREVIOUS}" \
            origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          for tag in $(jq -r '.git.tags[]' bump-result.json); do
            git push origin "refs/tags/${tag}"
          done

      - name: Create the GitHub release of the deployment
        # `--latest=false`: the collection release stays the latest one.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          COMMIT=$(jq -r '.git.commit' bump-result.json)
          for tag in $(jq -r '.git.tags[]' bump-result.json); do
            # The notes are the changelog entry multicz wrote at the bump:
            # `release-notes --tag` rebuilds them from the commits and leaves
            # out the upstream section (what the collection shipped).
            awk -v v="${tag##*-v}" '/^## \[/ { keep = index($0, "## [" v "]") == 1; next } keep' \
              "inventories/${ENV}/CHANGELOG.md" > "notes-${tag}.md"
            if [ ! -s "notes-${tag}.md" ]; then
              uv tool run multicz release-notes --tag "$tag" --output md > "notes-${tag}.md"
            fi
            gh release create "$tag" --target "$COMMIT" --title "$tag" \
              --notes-file "notes-${tag}.md" --latest=false
          done

      - name: Close the deploy issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ENV_NAME: ${{ needs.resolve-env.outputs.env }}
        run: |
          set -euo pipefail
          TITLE="ansible(${ENV_NAME}): pending deployment"
          ISSUE=$(gh issue list --state open --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' | head -n1)
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "Deployed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ENV_NAME: ${{ needs.resolve-env.outputs.env }}
        run: |
          NOTE="Environment \`${ENV_NAME}\`."
          if [ -f bump-result.json ]; then
            NOTE="${NOTE} Released: $(jq -r '[.git.tags[] | "`" + . + "`"] | join(", ")' bump-result.json)."
          fi
          scripts/summary.sh "apply (${ENV_NAME})" "$JOB_STATUS" --note "$NOTE" --file apply.txt
