---
- name: Write the persistent configuration
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ sysctl_config_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: sysctl_persistent | bool

# The module also records each value in a file. With sysctl_persistent it is
# the configuration file just written, which already holds the values, so it
# is left as it is. Without it a file of /run is used, never a persistent one.
- name: Apply the parameters at runtime
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    sysctl_file: "{{ sysctl_config_file if sysctl_persistent | bool else sysctl_runtime_file }}"
    reload: false
  loop: "{{ sysctl_parameters | dict2items | sort(attribute='key') }}"
  loop_control:
    label: "{{ item.key }}"
  become: true
  when: sysctl_apply | bool
