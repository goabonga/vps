---
- name: Manage the kernel parameters
  when: sysctl_enabled | bool
  block:
    - name: Check the host and the variables
      ansible.builtin.include_tasks: validate.yml

    - name: Configure the kernel parameters
      ansible.builtin.include_tasks: configure.yml
      when: sysctl_parameters | length > 0

    - name: Verify the running kernel
      ansible.builtin.include_tasks: verify.yml
      when:
        - sysctl_parameters | length > 0
        - sysctl_verify | bool
